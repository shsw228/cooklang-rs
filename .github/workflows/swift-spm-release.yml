name: Swift SPM Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.18.6-ja1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build and publish Swift XCFramework
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-swift-spm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-swift-spm-

      - name: Build host release library for UniFFI
        run: |
          cargo build --release -p cooklang-bindings

      - name: Build XCFramework and update Package.swift
        working-directory: bindings
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./build-swift.sh "${{ github.event.inputs.version }}"

      - name: Commit generated Swift package metadata
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift swift/Sources/CooklangParser/CooklangParser.swift

          if git diff --cached --quiet; then
            echo "No package metadata changes to commit"
          else
            git commit -m "[build] Publish Swift package artifacts for v${VERSION}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Create or update tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG_NAME="v${VERSION}"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG_NAME="v${VERSION}"

          gh release view "$TAG_NAME" \
            || gh release create "$TAG_NAME" --title "$TAG_NAME" --notes ""

          gh release upload "$TAG_NAME" bindings/out/CooklangParserFFI.xcframework.zip --clobber

      - name: Upload generated Swift wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-wrapper-${{ github.event.inputs.version }}
          path: bindings/out/CooklangParser.swift
